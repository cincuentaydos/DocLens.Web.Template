name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - sbx
          - prod
        default: sbx
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write # required for aws-actions/configure-aws-credentials to assume the OIDC role

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    # push events carry no `inputs` — default to sbx, the only environment
    # with a deploy role provisioned so far (see DocLens.Infra/governance).
    # `environment.url` makes the link show up on this run, on the commit's
    # status, and on the repo's Environments page — set SITE_URL per
    # environment alongside the other three vars.
    environment:
      name: ${{ github.event.inputs.environment || 'sbx' }}
      url: ${{ vars.SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync build to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

      - name: Print deployment URL
        run: echo "### Deployed to ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
